<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Store</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: white;
}

h1 {
  text-align: center;
}

.products {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

.product {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  width: 200px;
  text-align: center;
}

.product img {
  width: 100%;
  border-radius: 8px;
}

button {
  background: black;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 5px;
  cursor: pointer;
}

.cart {
  margin-top: 40px;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-bottom: 1px solid #ddd;
}
</style>
</head>

<body>

<h1>My Store</h1>

<div class="products">

  <div class="product">
    <h2>Product 1</h2>
    <p>$10.00</p>
    <button onclick="addToCart('Product 1', 10)">Add to Cart</button>
  </div>

  <div class="product">
    <h2>Product 2</h2>
    <p>$20.00</p>
    <button onclick="addToCart('Product 2', 20)">Add to Cart</button>
  </div>

  <div class="product">
    <h2>Product 3</h2>
    <p>$15.00</p>
    <button onclick="addToCart('Product 3', 15)">Add to Cart</button>
  </div>

</div>

<div class="cart">
  <h2>🛒 Your Cart</h2>
  <div id="cart-items"></div>
  <h3 id="total">Total: $0.00</h3>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, price) {
  let item = cart.find(product => product.name === name);

  if (item) {
    item.quantity++;
  } else {
    cart.push({
      name: name,
      price: price,
      quantity: 1
    });
  }

  saveCart();
  displayCart();
}

function changeQuantity(name, amount) {
  let item = cart.find(product => product.name === name);

  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {
    cart = cart.filter(product => product.name !== name);
  }

  saveCart();
  displayCart();
}

function saveCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
}

function displayCart() {
  const cartItems = document.getElementById("cart-items");
  const total = document.getElementById("total");

  cartItems.innerHTML = "";

  let totalPrice = 0;

  cart.forEach(item => {
    totalPrice += item.price * item.quantity;

    cartItems.innerHTML += `
      <div class="cart-item">
        <span>${item.name} - $${item.price}</span>
        <span>
          <button onclick="changeQuantity('${item.name}', -1)">−</button>
          ${item.quantity}
          <button onclick="changeQuantity('${item.name}', 1)">+</button>
        </span>
      </div>
    `;
  });

  total.innerText = "Total: $" + totalPrice.toFixed(2);
}

displayCart();
</script>

</body>
</html>
